name: Import Bukhari parts and parts UI

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install gdown
        run: python3 -m pip install --user gdown

      - name: Download Bukhari 7 parts from Drive
        run: python3 scripts/import_bukhari_parts.py

      - name: Commit PDFs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - << 'PY'
          from pathlib import Path
          import subprocess
          book = Path('Book')
          for p in book.glob('صحيح البخاري - الجزء * من 7.pdf'):
              head = p.read_bytes()[:4] if p.exists() else b''
              if head != b'%PDF' or p.stat().st_size < 1000000:
                  print('refuse', p, p.stat().st_size if p.exists() else 0)
                  continue
              subprocess.check_call(['git', 'add', str(p)])
          PY
          if git diff --cached --quiet; then
            echo no valid pdfs
            exit 0
          fi
          git commit -m "Add Sahih al-Bukhari 7 original parts from Drive"
          git push
