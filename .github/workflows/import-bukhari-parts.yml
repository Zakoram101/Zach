name: Import Bukhari parts and parts UI

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Bukhari 7 parts from Drive
        continue-on-error: true
        run: python3 scripts/import_bukhari_parts.py

      - name: Apply library parts UI
        run: python3 scripts/apply_parts_ui.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Book Moon/moon4.html Moon/book-parts.html js/book-parts.js
          if git diff --cached --quiet; then
            echo unchanged
            exit 0
          fi
          git commit -m "Add Bukhari 7-part downloads and parts library pages"
          git push
