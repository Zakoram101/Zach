name: Add dark mode toggle
on:
  push:
    paths:
      - ".github/workflows/add-dark-mode.yml"
      - "css/theme-toggle.css"
      - "js/theme-toggle.js"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject theme assets into HTML pages
        run: |
          python3 << 'PY'
          from pathlib import Path

          SKIP = {"form-ok.html"}
          changed = []

          def rel_prefix(path):
              parts = path.parts
              if path.name == "index.html" and len(parts) == 1:
                  return ""
              if "Moon" in parts or "Pages" in parts or "books" in parts:
                  return "../"
              return ""

          def inject(text, prefix):
              css = '<link rel="stylesheet" href="%scss/theme-toggle.css">' % prefix
              boot = (
                  "<script>"
                  "(function(){try{var t=localStorage.getItem('mishkat-theme');"
                  "if(t==='dark')document.documentElement.classList.add('theme-dark');}"
                  "catch(e){}})();"
                  "</script>"
              )
              js = '<script src="%sjs/theme-toggle.js" defer></script>' % prefix

              if "theme-toggle.css" not in text:
                  if "</head>" in text:
                      text = text.replace("</head>", "    %s\n    %s\n</head>" % (css, boot), 1)
                  elif "</HEAD>" in text:
                      text = text.replace("</HEAD>", "    %s\n    %s\n</HEAD>" % (css, boot), 1)
              elif "mishkat-theme" not in text and "</head>" in text:
                  text = text.replace("</head>", "    %s\n</head>" % boot, 1)

              if "theme-toggle.js" not in text:
                  if "</body>" in text:
                      text = text.replace("</body>", "    %s\n</body>" % js, 1)
                  elif "</BODY>" in text:
                      text = text.replace("</BODY>", "    %s\n</BODY>" % js, 1)
              return text

          for path in Path(".").rglob("*.html"):
              if any(part.startswith(".") for part in path.parts):
                  continue
              if path.name in SKIP:
                  continue
              original = path.read_text(encoding="utf-8")
              updated = inject(original, rel_prefix(path))
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("patched:", ", ".join(changed) if changed else "none")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo unchanged
            exit 0
          fi
          git commit -m "Add dark mode toggle to site navigation"
          git push
