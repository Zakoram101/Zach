name: Patch book authors

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch authors
        run: python3 scripts/patch_book_authors.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Moon/moon4.html
          if git diff --cached --quiet; then
            echo unchanged
            exit 0
          fi
          git commit -m "Show real authors on new download cards"
          git push
