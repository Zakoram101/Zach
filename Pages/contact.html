<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="shortcut icon" href="../favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة الدعم</title>
</head>
<body>
<script>
(function () {
    var source = 'https://raw.githubusercontent.com/Zakoram101/Zach/9cdb46a5ceeb8a9af7e4661efc0d4fe0658619ee/Pages/contact.html';
    fetch(source, { cache: 'no-store' })
        .then(function (res) {
            if (!res.ok) throw new Error(res.status);
            return res.text();
        })
        .then(function (html) {
            html = html.replace(
                /if \(userMessages\.length === 1 \|\| message\.length > 50\) \{[\s\S]*?sendSupportEmail\('رسالة من خدمة الدعم', message\);\s*\}/,
                "sendSupportEmail('رسالة دعم جديدة من موقع Zach', message);"
            );
            html = html.replace(
                /<div class="form-modal" id="subjectModal">[\s\S]*?<\/div>\s*<\/div>/,
                ''
            );
            html = html.replace(
                'submitSubjectBtn.addEventListener',
                'submitSubjectBtn && submitSubjectBtn.addEventListener'
            );
            html = html.replace(
                'cancelSubjectBtn.addEventListener',
                'cancelSubjectBtn && cancelSubjectBtn.addEventListener'
            );
            html = html.replace(
                'subjectInput.addEventListener',
                'subjectInput && subjectInput.addEventListener'
            );
            html = html.replace(
                'if (subjectModal.classList.contains(\'show\'))',
                'if (subjectModal && subjectModal.classList.contains(\'show\'))'
            );
            var patch = '<script src="./web3forms-plain.js"><\/script>\n</body>';
            if (html.indexOf('</body>') !== -1) html = html.replace('</body>', patch);
            else html += patch;
            document.open();
            document.write(html);
            document.close();
        })
        .catch(function () {
            document.body.textContent = 'تعذر تحميل صفحة الدعم';
        });
})();
</script>
</body>
</html>
