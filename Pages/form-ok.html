<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="shortcut icon" href="../favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم الإرسال</title>
    <link rel="stylesheet" href="../css/theme-toggle.css?v=3">
    <script>(function(){try{var t=localStorage.getItem('mishkat-theme');if(t==='dark')document.documentElement.classList.add('theme-dark');}catch(e){}})();</script>
    <style>
        body { font-family: Tajawal, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #ecf0f1; color: #2c3e50; }
        html.theme-dark body { background: #12181f; color: #ecf0f1; }
        .ok { background: #fff; padding: 28px 36px; border-radius: 14px; box-shadow: 0 8px 24px rgba(44,62,80,.12); }
        html.theme-dark .ok { background: #22303c; }
        a { color: #e74c3c; }
    </style>
</head>
<body>
    <p class="ok">تم الإرسال بنجاح — <a href="../index.html">العودة للرئيسية</a></p>
    <script src="../js/theme-toggle.js?v=3" defer></script>
</body>
</html>
